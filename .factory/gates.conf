# Required gates by level. A required gate that cannot run makes the verdict
# MISCONFIGURED (exit 2), never GREEN. Space-separated gate names.
#
# Available names: types lint test build audit mutation architecture
# Add build or mutation when the repository has a real command for it.

# .NET: `dotnet build` (nullable enabled) stands in for types; no lint tool is configured.
# `test` is deliberately NOT required yet because the repo has no test project. Add it to
# REQUIRED_FULL/REQUIRED_DEEP in the same change that adds the first test project.
# NOTE: gates.sh has no dotnet stack detection yet, so `build` is skipped and the verdict
# is MISCONFIGURED (fail-closed) until a human adds a dotnet block to .claude/scripts/gates.sh.
REQUIRED_FAST="build"
REQUIRED_FULL="build test"
REQUIRED_DEEP="build test audit architecture"

